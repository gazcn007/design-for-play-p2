<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CAR 03 // The City That Moves Together</title>
    <meta name="viewport" content="width=960, initial-scale=1" />
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: #03050a;
        color: #dfe7f2;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      #game {
        width: 960px;
        height: 600px;
        margin: 0;
        box-shadow: 0 0 24px #000000;
        flex: 0 0 auto;
      }
      canvas {
        display: block;
      }
      .hud {
        width: 960px;
        margin: 0;
        padding: 6px 10px;
        font-size: 12px;
        line-height: 1.4;
        color: #9fb7c0;
        background: #0a1015;
        border: 1px solid #1c2830;
        border-radius: 4px;
        box-sizing: border-box;
        flex: 0 0 auto;
      }
      .hud strong { color: #dfe7f2; }
      .hud kbd {
        background: #17232b;
        color: #dfe7f2;
        border: 1px solid #405159;
        border-bottom-width: 2px;
        border-radius: 3px;
        padding: 0 4px;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="hud">
      <strong>CAR 03 // THE CITY THAT MOVES TOGETHER</strong> &nbsp; isolated vertical slice.
      Move <kbd>←/A</kbd> <kbd>→/D</kbd>. Lane shift <kbd>↑/W</kbd> <kbd>↓/S</kbd>. Anchor <kbd>E</kbd>. Reset <kbd>R</kbd>.
      QA: <code>?qa=car3&amp;state=&lt;name&gt;</code>
    </div>
    <div id="game"></div>
    <script type="module" src="/src/car03-main.js"></script>
  </body>
</html>
